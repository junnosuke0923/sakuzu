<!doctype html><html lang="ja"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スカート作図 (レイヤー分け)</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#000;color:#111;
 font:15px/1.6 "Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:#000}
/* 教材1ページぶんの紙面。元のGoogleスライドと同じ 9:16。外側の黒は投影しても映らない。
   作図と帯はこの中だけに入れる（layoutSheet が大きさと位置を決める）。 */
#sheet{position:absolute;overflow:hidden;background:#8b8e93}
#stage svg{width:100%;height:100%;display:block}
/* 帯はカンバスの下端に浮かべる（場所を取らない）。用紙は中央のまま、机（グレー）の上に
   紙が置いてあるように見せる。色が付くのは中の .capin だけで、その幅は
   「用紙の表示幅 × (viewBox幅/用紙幅)」＝スマホで見たときと同じ比率（fitBar が計算）。
   スマホ（縦）では結果的に画面いっぱいになる。少し透けさせてある。 */
/* 帯は用紙にくっついている。**カンバスの中の重ね層**にして、はみ出しても切れるだけに
   する（背景色を持たせないこと。塗ると作図が消える）。場所は svg の高さを縮めて作る。 */
#bar{position:absolute;inset:0;pointer-events:none;z-index:1}
/* 扉ページ。用紙にぴったり重ねる（大きさは coverLay が用紙幅から決める）。
   文字は縦中央に色の帯を渡して白抜き。帯は少し透けさせて作図が中も通るようにする。 */
#cover{position:absolute;display:none;z-index:2;pointer-events:none;overflow:hidden;
 font-family:"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif}
#cover.on{display:block}
#cover .in{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%)}
/* 帯全体に opacity を掛けないこと（掛けると差し色の線もそれ以上濃くできない） */
#cover .tag{display:flex;align-items:center;white-space:nowrap;
 font-weight:600;letter-spacing:.24em}
#cover .tag span{opacity:.82}
#cover .tag i{display:block;flex:none}
#cover .t{font-weight:700;line-height:1.22;letter-spacing:.01em}
#cover .s{opacity:.88;line-height:1.75}
#bar .capin{position:absolute;background:#0b7285;color:#fff;
 padding:14px 16px;font-size:16px;line-height:1.6;min-height:66px;
 overflow-wrap:anywhere;word-break:normal;
 display:flex;flex-direction:column;justify-content:flex-start}
#bar .captxt{width:100%}
#bar .cn{font-weight:700;opacity:.92;margin-right:.15em}
/* マーカーは太字を兼ねない。帯は濃い色に白文字なので全面を黄色くして文字を黒にする */
#bar .hl{background:#ffe066;color:#1a1a1a;border-radius:2px;padding:0 .12em}
#bar .capin u{text-decoration:underline;text-underline-offset:.18em}
#pos{position:absolute;top:8px;right:12px;font-size:12px;color:#ddd;background:rgba(0,0,0,.5);border-radius:10px;padding:2px 8px;z-index:2}
#nav{position:absolute;inset:0;display:flex}#nav div{flex:1}#nav .p{flex:0 0 30%}
/* 送り方が分かるように、左右へ薄い矢印を常に出しておく（タップもスワイプも従来どおり効く）。
   端に寄せてあるので作図には掛からない。最初の手順だけ「タップで次へ」を数秒出す。 */
.arw{position:absolute;top:50%;transform:translateY(-50%);z-index:3;pointer-events:none;
 width:40px;height:56px;display:flex;align-items:center;justify-content:center;
 color:#fff;opacity:.42;font-size:30px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.arw.l{left:2px}.arw.r{right:2px}.arw.off{opacity:.12}
#hintTap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:4;
 background:rgba(0,0,0,.6);color:#fff;border-radius:20px;padding:8px 16px;font-size:13px;
 pointer-events:none;transition:opacity .6s}
#hintTap.off{opacity:0}
#toc,#pres,#fs{position:absolute;top:6px;left:8px;z-index:3;background:rgba(0,0,0,.5);color:#fff;border:0;
 border-radius:10px;padding:4px 10px;font-size:16px;cursor:pointer;line-height:1}
#pres{left:52px;display:none}
#fs{left:auto;right:12px;top:34px}
#rst{left:auto;right:12px;top:70px;display:none}
body.panning #stage{cursor:grabbing}
#laser{position:fixed;z-index:20;width:20px;height:20px;border-radius:50%;pointer-events:none;display:none;
 background:radial-gradient(circle,#ff5252 0 32%,rgba(255,50,50,.5) 60%,transparent 72%);
 box-shadow:0 0 14px 5px rgba(255,60,60,.55);transform:translate(-50%,-50%)}
body.laser{cursor:none}
#panel{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.82);display:none;
 flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px 12px}
#panel.open{display:flex}
#panel h1{color:#fff;font-size:15px;margin:0 0 10px;font-weight:600}
#panel .list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#panel .it{color:#fff;padding:13px 14px;border-radius:8px;background:rgba(255,255,255,.08);margin-bottom:8px;cursor:pointer}
#panel .it.cur{background:#0b7285}
#panel .it small{display:block;color:#bcd;font-size:12px;margin-top:2px}
#panel .cl{margin-top:10px;padding:12px;text-align:center;color:#bbb;cursor:pointer}
</style>
<div id="stage"><div id="sheet"><div id="cover"><div class="in"><div class="tag"><i></i><span>作図手順</span></div><div class="t"></div><div class="s"></div></div></div><div id="bar"></div></div><button id="toc">☰</button><button id="pres">📝</button><button id="fs" title="全画面（Escで戻る）">⛶</button><button id="rst" title="拡大・移動を戻す（0）">⤾</button><div id="pos"></div><div id="nav"><div class="p"></div><div></div></div><div class="arw l" id="arwL">‹</div><div class="arw r" id="arwR">›</div><div id="hintTap">タップまたはスワイプで次へ</div></div>
<div id="laser"></div>
<div id="panel"><h1>目次</h1><div class="list" id="toclist"></div><div class="cl" id="tocclose">閉じる</div></div>

 let cur=box;
 const d=(a,b)=>(a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y);
 for(const it of geo){const e=ends(it); if(!e)continue;
  const hand=st&&st.rev&&st.rev[it.key];          /* 手で決めた向き */
  const fr=st&&st.from&&st.from[it.uid];          /* 割り当てたときに押した位置 */
  if(hand!==undefined)it.rev=!!hand;
  else if(fr&&it.first)it.rev=d({x:fr[0],y:fr[1]},e[1])<d({x:fr[0],y:fr[1]},e[0]);
  else it.rev=cur?d(cur,e[1])<d(cur,e[0]):false;
  cur=it.rev?e[0]:e[1];}}
function penAt(it,done){const l=it.rev?it.len-done:done;
 try{return it.el.getPointAtLength(l);}catch(e){return null;}}
function penCollect(st){
 const sel="path,line,polyline,polygon,rect,circle,ellipse,text",out=[];
 for(const id of (st.ids||[])){
  const u=units.find(x=>x.id===id); if(!u||u.el.dataset.psfix==="1")continue;
  const els=(u.el.matches&&u.el.matches(sel))?[u.el]:[...u.el.querySelectorAll(sel)];
  els.forEach((el,i)=>{let L=0;try{if(el.getTotalLength)L=el.getTotalLength();}catch(e){}
   const b={el,uid:id,key:id+"#"+i,first:i===0};
   if(!isFinite(L)||L<=0)out.push(Object.assign(b,{len:8*MM,geo:false}));
   else out.push(Object.assign(b,{len:L,geo:true}));});}
 penChain(out,st); return out;}
function penEl(){
 if(_pEl&&_pEl.parentNode)return _pEl;
 _pEl=document.createElementNS(NS,"image");
 _pEl.setAttribute("href",PENIMG); _pEl.setAttribute("pointer-events","none");
 const w=PMM*MM; _pEl.setAttribute("width",w); _pEl.setAttribute("height",w*140/317);
 svg.appendChild(_pEl); return _pEl;}
function penMove(x,y){const el=penEl(),w=PMM*MM,h=w*140/317;
 el.setAttribute("x",x-w*PTX); el.setAttribute("y",y-h*PTY); el.style.display="";}
function penStop(){
 if(_pRAF){cancelAnimationFrame(_pRAF);_pRAF=0;}
 svg.querySelectorAll("[data-psink]").forEach(n=>n.remove());   /* 取りこぼさない */
 _pInk=null;
 if(_pEl)_pEl.style.display="none";}
function penPending(){
 if(!PENON||_pDone.has(cur)||kindOf(cur))return false;
 const st=D.steps[cur]; return !!(st&&st.ids&&st.ids.length);}
function penRun(){
 penStop(); if(!penPending())return false;
 const items=penCollect(D.steps[cur]); if(!items.length)return false;
 let acc=0; for(const it of items){it.at=acc;acc+=it.len;}
 const total=acc,dur=Math.max(PMIN,Math.min(PMAX,total/(PSPD*MM)*1000));
 _pInk=[];
 for(const it of items){
  if(!it.geo){it.ink=null;continue;}
  const c=it.el.cloneNode(false); c.removeAttribute("data-psid"); c.dataset.psink="1";
  const cs=getComputedStyle(it.el);
  c.style.stroke="#000"; c.style.fill="none"; c.style.strokeWidth=cs.strokeWidth;
  c.style.strokeDasharray=it.len; c.style.strokeDashoffset=it.rev?-it.len:it.len;
  c.setAttribute("pointer-events","none");
  it.el.parentNode.insertBefore(c,it.el.nextSibling);
  it.ink=c; _pInk.push(c);}
 const t0=performance.now();
 const tick=now=>{
  const k=Math.min(1,(now-t0)/dur),pos=k*total; let tip=null;
  for(const it of items){
   const done=Math.max(0,Math.min(it.len,pos-it.at));
   if(it.ink){it.ink.style.strokeDashoffset=it.rev?-(it.len-done):(it.len-done);
    if(done>0&&done<it.len)tip=penAt(it,done);}
   else if(done>=it.len){it.el.style.stroke="";it.el.style.fill="";}}
  if(tip)penMove(tip.x,tip.y);
  if(k<1)_pRAF=requestAnimationFrame(tick);
  else {_pRAF=0;penStop();_pDone.add(cur);draw(false);}};
 _pRAF=requestAnimationFrame(tick);
 return true;}
function go(d){
 if(d>0&&PENON){
  if(_pRAF){penStop();_pDone.add(cur);draw(false);return;}
  if(penRun())return;}
 penStop();
 cur=Math.min(D.steps.length-1,Math.max(0,cur+d));draw();}
const nav=document.getElementById("nav");
/* ── 手で拡大・移動する（授業でプロジェクタに映しながら細部を見せるため）──
   viewBox を直接動かす。手順を送ると draw() が setBox で元の範囲に戻す。 */
const rstBtn=document.getElementById("rst");
function vbPut(v){vbNow=v;svg.setAttribute("viewBox",v.x+" "+v.y+" "+v.w+" "+v.h);
 rstBtn.style.display="block";
 /* 拡大・移動に合わせて帯と扉も追従させる（用紙との関係が崩れないように） */
 fitBar();fitCover();}
function vbStop(){if(vbRAF){cancelAnimationFrame(vbRAF);vbRAF=0;}}
window.vbHideReset=()=>{rstBtn.style.display="none";};
rstBtn.onclick=e=>{e.stopPropagation();vbStop();setBox(boxOf(cur),true);rstBtn.style.display="none";};
stage.addEventListener("wheel",e=>{
 e.preventDefault();vbStop();
 const m=svg.getScreenCTM();if(!m)return;
 const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
 const f=e.deltaY<0?1/1.15:1.15;
 const w=Math.max(FULL.w*0.03,Math.min(FULL.w*3,vbNow.w*f)),k=w/vbNow.w;
 vbPut({x:p.x-(p.x-vbNow.x)*k,y:p.y-(p.y-vbNow.y)*k,w:vbNow.w*k,h:vbNow.h*k});
},{passive:false});
let pan=null,panned=false;
stage.addEventListener("mousedown",e=>{
 if(e.button!==1)return;                 /* ホイールボタン長押しで移動。左クリックは手順送り */
 if(e.target.closest("button"))return;
 const m=svg.getScreenCTM();
 pan={x:e.clientX,y:e.clientY,vb:{...vbNow},sc:(m&&m.a)?1/m.a:1,moved:false};
 e.preventDefault();});
addEventListener("mousemove",e=>{
 if(!pan)return;
 if(!pan.moved){if(Math.abs(e.clientX-pan.x)+Math.abs(e.clientY-pan.y)<=6)return;
  pan.moved=true;document.body.classList.add("panning");vbStop();}
 vbPut({x:pan.vb.x-(e.clientX-pan.x)*pan.sc,y:pan.vb.y-(e.clientY-pan.y)*pan.sc,
        w:pan.vb.w,h:pan.vb.h});});
addEventListener("mouseup",()=>{if(!pan)return;panned=pan.moved;pan=null;
 document.body.classList.remove("panning");});
/* 指の操作を送りと取り違えないための番人。
   **指が2本になったら、その一連の操作は送りにしない。** 拡大しようとして広げた指の動きが
   そのまま「スワイプ」と読まれ、勝手に手順が進む／戻るという苦情があった。
   離した直後にブラウザが出す疑似タップも同じ経路で送りになるので、少しのあいだ止める。 */
let tGuard=0;
const nogo=()=>{if(Date.now()<tGuard)return true;if(panned){panned=false;return true;}return false;};
nav.children[0].onclick=()=>{if(!nogo())go(-1);};
nav.children[1].onclick=()=>{if(!nogo())go(1);};
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")go(1);if(e.key==="ArrowLeft")go(-1);
 if(e.key==="0"){vbStop();setBox(boxOf(cur),true);rstBtn.style.display="none";}});
let tp=null,tMulti=false;
addEventListener("touchstart",e=>{
 if(e.touches.length>1){tMulti=true;tp=null;return;}      /* 2本目が来たら送りにしない */
 if(tMulti)return;
 tp={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
addEventListener("touchmove",e=>{if(e.touches.length>1){tMulti=true;tp=null;}},{passive:true});
addEventListener("touchcancel",()=>{tp=null;tMulti=false;tGuard=Date.now()+500;},{passive:true});
addEventListener("touchend",e=>{
 if(e.touches.length>0)return;                            /* まだ指が残っている */
 if(tMulti){tMulti=false;tGuard=Date.now()+500;tp=null;return;}
 const p=tp;tp=null;if(!p)return;
 const dx=e.changedTouches[0].clientX-p.x,dy=e.changedTouches[0].clientY-p.y;
 /* 横に大きく、かつ縦より横に動いたときだけスワイプ。斜めや縦の動きは送らない */
 if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5){tGuard=Date.now()+500;go(dx<0?1:-1);return;}
 if(Math.abs(dx)>12||Math.abs(dy)>12)tGuard=Date.now()+500;  /* 動かした＝送りではない */
},{passive:true});
try{const v=+localStorage.getItem("ps:"+D.title);if(v>0&&v<D.steps.length)cur=v;}catch(e){}
draw(false);
/* 送り方の案内。一度でも操作したら消し、以後は出さない */
(function(){var h=document.getElementById("hintTap");
 if(!h)return;
 var gone=false, hide=function(){if(gone)return;gone=true;h.classList.add("off");
  setTimeout(function(){h.style.display="none";},700);};
 setTimeout(hide,5000);
 ["click","touchstart","keydown"].forEach(function(ev){addEventListener(ev,hide,{once:true,passive:true});});
})();
