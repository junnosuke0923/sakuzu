<!doctype html><html lang="ja"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スカート作図 (レイヤー分け)</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#000;color:#111;
 font:15px/1.6 "Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{flex:1;min-height:0;position:relative;background:#000}
#stage svg{width:100%;height:100%;display:block}
/* 帯の外側は用紙の外と同じ黒。色が付くのは中の .capin だけで、その幅は
   「用紙の表示幅 × (viewBox幅/用紙幅)」＝スマホで見たときと同じ比率（fitBar が計算）。
   スマホ（縦）では結果的に画面いっぱいになる。 */
#bar{background:#000;display:flex;justify-content:center;flex:none}
#bar .capin{background:#0b7285;color:#fff;width:100%;
 padding:14px 16px calc(14px + env(safe-area-inset-bottom));font-size:16px;line-height:1.6;min-height:66px}
#bar .hl{background:linear-gradient(transparent 62%,#ffe066 62%);font-weight:700}
#pos{position:absolute;top:8px;right:12px;font-size:12px;color:#ddd;background:rgba(0,0,0,.5);border-radius:10px;padding:2px 8px;z-index:2}
#nav{position:absolute;inset:0;display:flex}#nav div{flex:1}#nav .p{flex:0 0 30%}
#toc,#pres,#fs{position:absolute;top:6px;left:8px;z-index:3;background:rgba(0,0,0,.5);color:#fff;border:0;
 border-radius:10px;padding:4px 10px;font-size:16px;cursor:pointer;line-height:1}
#pres{left:52px;display:none}
#fs{left:auto;right:12px;top:34px}
#rst{left:auto;right:12px;top:70px;display:none}
body.panning #stage{cursor:grabbing}
#laser{position:fixed;z-index:20;width:20px;height:20px;border-radius:50%;pointer-events:none;display:none;
 background:radial-gradient(circle,#ff5252 0 32%,rgba(255,50,50,.5) 60%,transparent 72%);
 box-shadow:0 0 14px 5px rgba(255,60,60,.55);transform:translate(-50%,-50%)}
body.laser{cursor:none}
#panel{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.82);display:none;
 flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px 12px}
#panel.open{display:flex}
#panel h1{color:#fff;font-size:15px;margin:0 0 10px;font-weight:600}
#panel .list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#panel .it{color:#fff;padding:13px 14px;border-radius:8px;background:rgba(255,255,255,.08);margin-bottom:8px;cursor:pointer}
#panel .it.cur{background:#0b7285}
#panel .it small{display:block;color:#bcd;font-size:12px;margin-top:2px}
#panel .cl{margin-top:10px;padding:12px;text-align:center;color:#bbb;cursor:pointer}
</style>
<div id="stage"><button id="toc">☰</button><button id="pres">📝</button><button id="fs" title="全画面（Escで戻る）">⛶</button><button id="rst" title="拡大・移動を戻す（0）">⤾</button><div id="pos"></div><div id="nav"><div class="p"></div><div></div></div></div>
<div id="laser"></div>
<div id="panel"><h1>目次</h1><div class="list" id="toclist"></div><div class="cl" id="tocclose">閉じる</div></div>
<div id="bar"></div>

function lum(hex){const m=/^#([0-9a-f]{6})$/i.exec(hex||"");if(!m)return 0;

const CAPFS=Math.min(28,Math.max(12,+(D.settings.capFontPx)||16)),PHW=375;
function paperScr(){const el=svg.querySelector("#__psPaper");if(!el)return null;
 const r=el.getBoundingClientRect();return (r.width&&r.height)?r:null;}
function fitBar(){
 if(!CAPON)return;
 const bar=document.getElementById("bar"),inn=bar.querySelector(".capin");
 if(!inn)return;
 const mn=Math.max(12,Math.round(CAPFS*0.75));
 for(let pass=0;pass<3;pass++){
  const pr=paperScr();
  let w=bar.clientWidth||PHW;
  if(pr&&PAPER_U&&PAPER_U.w>0)w=Math.min(w,pr.width*(FULL.w/PAPER_U.w));
  const k=w/PHW;
  inn.style.width=w+"px";
  inn.style.padding=(14*k)+"px "+(16*k)+"px calc("+(14*k)+"px + env(safe-area-inset-bottom))";
  inn.style.minHeight=(66*k)+"px";
  let fs=CAPFS;inn.style.fontSize=(fs*k)+"px";
  const maxH=(CAPFS*1.6*3+30)*k;
  while(inn.scrollHeight>maxH&&fs>mn){fs--;inn.style.fontSize=(fs*k)+"px";}
 }
}
addEventListener("resize",()=>fitBar());
const CHAPS=D.steps.map((s,i)=>s.chapter?{i:i,t:s.chapter}:null).filter(Boolean);
const panel=document.getElementById("panel");
function buildToc(){
 const box=document.getElementById("toclist");box.innerHTML="";
 const items=CHAPS.length?CHAPS:D.steps.map((s,i)=>({i:i,t:"手順 "+(i+1)}));
 for(const c of items){
  const d=document.createElement("div");
  d.className="it"+(chapOf(cur)===c.t&&CHAPS.length?" cur":(!CHAPS.length&&c.i===cur?" cur":""));
  const cap=(D.steps[c.i].caption||"").replace(/\*\*|__/g,"").slice(0,40);
  d.innerHTML="<b></b><small></small>";
  d.querySelector("b").textContent=c.t;
  d.querySelector("small").textContent="手順 "+(c.i+1)+(cap?"　"+cap:"");
  d.onclick=()=>{cur=c.i;panel.classList.remove("open");draw(false);};
  box.appendChild(d);}}
document.getElementById("toc").onclick=()=>{buildToc();panel.classList.add("open");};
document.getElementById("tocclose").onclick=()=>panel.classList.remove("open");
panel.onclick=e=>{if(e.target===panel)panel.classList.remove("open");};

/* 発表者ビュー：別ウィンドウにメモを出す（投影中の画面には出さない） */
let pres=null;
if(D.notes) document.getElementById("pres").style.display="block";
function openPresenter(){
 if(!D.notes) return;
 if(pres&&!pres.closed){pres.focus();return;}
 pres=window.open("","ps_presenter","width=760,height=580");
 if(!pres){alert("ポップアップがブロックされました。許可してからもう一度お試しください。");return;}
 const doc=pres.document;
 if(!doc.body){doc.write("<!doctype html><body>");doc.close();}
 doc.title="発表者ビュー — "+D.title;
 doc.body.style.cssText="margin:0;padding:18px;background:#111;color:#eee;"+
  "font:15px/1.7 'Hiragino Kaku Gothic ProN','Yu Gothic UI',sans-serif";
 doc.body.innerHTML="";
 const mk=(css,txt)=>{const e=doc.createElement("div");e.style.cssText=css;if(txt)e.textContent=txt;doc.body.appendChild(e);return e;};
 pres.__pos =mk("color:#6fd3c4;font-size:13px;letter-spacing:.04em");
 pres.__cap =mk("font-size:21px;font-weight:700;margin:8px 0 14px;line-height:1.5");
 mk("color:#888;font-size:12px","メモ");
 pres.__note=mk("white-space:pre-wrap;background:#1c1c1c;border-radius:8px;padding:14px;min-height:150px;font-size:16px");
 pres.__next=mk("color:#999;margin-top:14px;font-size:13px");
 const bar=mk("margin-top:18px;display:flex;gap:10px");
 const mkb=(t,f)=>{const b=doc.createElement("button");b.textContent=t;
  b.style.cssText="flex:1;padding:15px;font-size:16px;cursor:pointer;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#eee";
  b.onclick=f;bar.appendChild(b);};
 mkb("◀ 前へ",()=>go(-1)); mkb("次へ ▶",()=>go(1));
 doc.addEventListener("keydown",ev=>{if(ev.key==="ArrowRight")go(1);if(ev.key==="ArrowLeft")go(-1);});
 updatePresenter();
 autoScreens();
}
/* プロジェクター接続時の自動配置（Chrome/Edge の Window Management API）。
   投影側の画面＝この教材を全画面、手元の画面＝発表者ビュー。
   APIが無い・許可されない・画面が1つなら何もしない（手で並べればよい）。 */
async function autoScreens(){
 try{
  if(!window.getScreenDetails) return;
  const sd=await window.getScreenDetails();
  if(sd.screens.length<2) return;
  const cs=sd.currentScreen, other=sd.screens.find(s=>s!==cs);
  if(!other) return;
  if(pres&&!pres.closed){
   pres.moveTo(cs.availLeft+40,cs.availTop+40);
   pres.resizeTo(Math.min(920,cs.availWidth-80),Math.min(720,cs.availHeight-80));
   pres.focus();
  }
  await document.documentElement.requestFullscreen({screen:other});
 }catch(e){}
}
function updatePresenter(){
 if(!pres||pres.closed||!pres.__pos)return;
 const ch=chapOf(cur), s=D.steps[cur]||{}, n=D.steps[cur+1];
 pres.__pos.textContent=(ch?ch+"　":"")+(cur+1)+" / "+D.steps.length;
 pres.__cap.textContent=(s.caption||"").replace(/\*\*|__/g,"");
 pres.__note.textContent=s.note||"（この手順にメモはありません）";
 pres.__next.textContent=n?("次の手順: "+(n.caption||"").replace(/\*\*|__/g,"").slice(0,70)):"（最後の手順です）";
}
document.getElementById("pres").onclick=openPresenter;
addEventListener("keydown",e=>{if((e.key==="n"||e.key==="N")&&D.notes)openPresenter();});
/* 全画面（授業でプロジェクタに映すとき用）。iPhoneのSafariなど非対応環境ではボタンを隠す */
const fsBtn=document.getElementById("fs"), docEl=document.documentElement;
if(!docEl.requestFullscreen) fsBtn.style.display="none";
fsBtn.onclick=()=>{ try{
 if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
 else docEl.requestFullscreen().catch(()=>{}); }catch(e){} };
/* L で指し示し用のポインター（マウス操作の端末向け） */
let laserOn=false;const laserEl=document.getElementById("laser");
function setLaser(on){laserOn=on;document.body.classList.toggle("laser",on);laserEl.style.display=on?"block":"none";}
addEventListener("keydown",e=>{if(e.key.toLowerCase()==="l"&&!e.ctrlKey&&!e.metaKey&&!e.altKey)setLaser(!laserOn);});
addEventListener("mousemove",e=>{if(laserOn){laserEl.style.left=e.clientX+"px";laserEl.style.top=e.clientY+"px";}},{passive:true});
function go(d){cur=Math.min(D.steps.length-1,Math.max(0,cur+d));draw();}
const nav=document.getElementById("nav");
/* ── 手で拡大・移動する（授業でプロジェクタに映しながら細部を見せるため）──
   viewBox を直接動かす。手順を送ると draw() が setBox で元の範囲に戻す。 */
const rstBtn=document.getElementById("rst");
function vbPut(v){vbNow=v;svg.setAttribute("viewBox",v.x+" "+v.y+" "+v.w+" "+v.h);
 rstBtn.style.display="block";}
function vbStop(){if(vbRAF){cancelAnimationFrame(vbRAF);vbRAF=0;}}
window.vbHideReset=()=>{rstBtn.style.display="none";};
rstBtn.onclick=e=>{e.stopPropagation();vbStop();setBox(boxOf(cur),true);rstBtn.style.display="none";};
stage.addEventListener("wheel",e=>{
 e.preventDefault();vbStop();
 const m=svg.getScreenCTM();if(!m)return;
 const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
 const f=e.deltaY<0?1/1.15:1.15;
 const w=Math.max(FULL.w*0.03,Math.min(FULL.w*3,vbNow.w*f)),k=w/vbNow.w;
 vbPut({x:p.x-(p.x-vbNow.x)*k,y:p.y-(p.y-vbNow.y)*k,w:vbNow.w*k,h:vbNow.h*k});
},{passive:false});
let pan=null,panned=false;
stage.addEventListener("mousedown",e=>{
 if(e.button!==1)return;                 /* ホイールボタン長押しで移動。左クリックは手順送り */
 if(e.target.closest("button"))return;
 const m=svg.getScreenCTM();
 pan={x:e.clientX,y:e.clientY,vb:{...vbNow},sc:(m&&m.a)?1/m.a:1,moved:false};
 e.preventDefault();});
addEventListener("mousemove",e=>{
 if(!pan)return;
 if(!pan.moved){if(Math.abs(e.clientX-pan.x)+Math.abs(e.clientY-pan.y)<=6)return;
  pan.moved=true;document.body.classList.add("panning");vbStop();}
 vbPut({x:pan.vb.x-(e.clientX-pan.x)*pan.sc,y:pan.vb.y-(e.clientY-pan.y)*pan.sc,
        w:pan.vb.w,h:pan.vb.h});});
addEventListener("mouseup",()=>{if(!pan)return;panned=pan.moved;pan=null;
 document.body.classList.remove("panning");});
const nogo=()=>{if(panned){panned=false;return true;}return false;};
nav.children[0].onclick=()=>{if(!nogo())go(-1);};
nav.children[1].onclick=()=>{if(!nogo())go(1);};
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")go(1);if(e.key==="ArrowLeft")go(-1);
 if(e.key==="0"){vbStop();setBox(boxOf(cur),true);rstBtn.style.display="none";}});
let tx=null;addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;
 if(Math.abs(dx)>40)go(dx<0?1:-1);},{passive:true});
try{const v=+localStorage.getItem("ps:"+D.title);if(v>0&&v<D.steps.length)cur=v;}catch(e){}
draw(false);
</script></html>
